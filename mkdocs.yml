      - Title: 02-viet-tung-phan/title.md
      - Abstract: 02-viet-tung-phan/abstract.md
      - Introduction & Figure 1: 02-viet-tung-phan/introduction.md
      - Related Work: 02-viet-tung-phan/related-work.md
      - Method: 02-viet-tung-phan/method.md
      - Experiments: 02-viet-tung-phan/experiments.md
      - Figures & Tables: 02-viet-tung-phan/figures-tables.md
      - Conclusion, Limitations, Appendix: 02-viet-tung-phan/conclusion-supp.md
  - "3. Kỹ thuật & văn phong":
