site_name: Viết Paper A* từ A đến Z
site_description: Giáo trình về quy trình viết một bài báo khoa học cho các hội nghị A* trong Computer Vision (CVPR, ICCV, ECCV), Xử lý ngôn ngữ tự nhiên (ACL, EMNLP, NAACL) và Machine Learning (NeurIPS, ICML, ICLR).
site_author: tuandung222
site_url: https://tuandung222.github.io/How-to-write-Astar-Paper/
repo_url: https://github.com/tuandung222/How-to-write-Astar-Paper
repo_name: tuandung222/How-to-write-Astar-Paper
edit_uri: edit/main/docs/

theme:
  name: material
  language: vi
  icon:
    logo: material/school
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Chế độ sáng
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link

plugins:
  - search
  # print-site phải đứng CUỐI danh sách plugins
  - print-site:
      add_to_navigation: false
      print_page_title: "Bản in"
      add_print_site_banner: false
      add_cover_page: true
      cover_page_template: pdf/cover.tpl
      add_table_of_contents: true
      toc_title: "Mục lục"
      toc_depth: 2
      enumerate_headings: false   # tiêu đề đã tự đánh số 0., 1., ...
      enumerate_figures: false
      add_full_urls: false
      path_to_pdf: ""

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  # Mermaid + MathJax được tải về bằng scripts/fetch_vendor.sh (không phụ thuộc CDN)
  - javascripts/vendor/mermaid.min.js
  - javascripts/mathjax.js
  - javascripts/vendor/tex-svg.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/print.css

nav:
  - Lời nói đầu: index.md
  - "0. Tổng quan":
      - 00-tong-quan/index.md
      - Bản đồ các hội nghị A*: 00-tong-quan/ban-do-hoi-nghi.md
      - "Computer Vision: CVPR, ICCV, ECCV": 00-tong-quan/he-sinh-thai-cv.md
      - "NLP: ACL, EMNLP, NAACL": 00-tong-quan/he-sinh-thai-nlp.md
      - "ML/DL: NeurIPS, ICML, ICLR": 00-tong-quan/he-sinh-thai-ml.md
      - "Speech: Interspeech, ICASSP": 00-tong-quan/he-sinh-thai-speech.md
      - "IR & Data Mining: SIGIR, KDD, WWW": 00-tong-quan/he-sinh-thai-ir.md
      - Paper được đánh giá thế nào: 00-tong-quan/review-process.md
      - Lộ trình thực hiện một paper: 00-tong-quan/lo-trinh.md
  - "1. Nghiên cứu trước khi viết":
      - 01-truoc-khi-viet/index.md
      - Đọc và nhìn ra khoảng trống:
          - Đọc & lập bản đồ tài liệu: 01-truoc-khi-viet/literature.md
          - Đọc paper như một reviewer: 01-truoc-khi-viet/doc-nhu-reviewer.md
          - Tìm khoảng trống & nguồn ý tưởng: 01-truoc-khi-viet/tim-khoang-trong.md
      - Từ ý tưởng tới kế hoạch:
          - Thẩm định ý tưởng: 01-truoc-khi-viet/y-tuong.md
          - Lập kế hoạch nghiên cứu: 01-truoc-khi-viet/ke-hoach.md
      - Thực nghiệm:
          - Thiết kế thí nghiệm: 01-truoc-khi-viet/thi-nghiem.md
          - Vận hành thực nghiệm: 01-truoc-khi-viet/thuc-thi.md
      - Câu chuyện:
          - Xây "câu chuyện" của paper: 01-truoc-khi-viet/cau-chuyen.md
  - "2. Viết từng phần":
